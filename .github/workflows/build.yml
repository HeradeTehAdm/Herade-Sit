name: Проверка сборки

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Собрать мод
        run: gradle build --no-daemon

      - name: Сохранить JAR-файлы сборки
        uses: actions/upload-artifact@v4
        with:
          name: Herade-Sit-Minecraft-26.3
          path: build/libs/*.jar
          if-no-files-found: error
